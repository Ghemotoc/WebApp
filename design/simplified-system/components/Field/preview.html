<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field</title>
</head>
<body>

<div class="gh-stage">
  <div class="gh-field"><label for="f1">Bookshelf name</label><input class="gh-input" id="f1" value="Summer reads"><span class="gh-hint">Up to 60 characters.</span></div>
  <div class="gh-field"><label for="f2">Bookshelf name</label><input class="gh-input is-error" id="f2" value="" aria-invalid="true" aria-describedby="f2e"><span class="gh-error" id="f2e">A bookshelf name has 1 to 60 characters.</span></div>
  <div class="gh-field"><label for="f3">Who can see it</label><span class="gh-select"><select id="f3"><option>Private: only you</option><option>Public: everyone</option></select><svg class="gh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></div>
</div>
</body>
</html>
