<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AddToBookshelf</title>
</head>
<body>

<div class="gh-stage">
  <div class="gh-sheet gh-glass" role="dialog" aria-labelledby="add-title">
    <div class="gh-sheet__head"><h2 class="subheading" id="add-title">Add to a bookshelf</h2>
      <button type="button" class="gh-iconbtn" aria-label="Close"><svg class="gh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button></div>
    <div class="gh-sheet__row"><div><div class="label" style="color:var(--ink-heading)">Summer reads</div><div class="meta">7 of 10</div></div><button type="button" class="gh-iconbtn" aria-pressed="false" aria-label="Summer reads"><svg class="gh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button></div><div class="gh-sheet__row"><div><div class="label" style="color:var(--ink-heading)">Poems to keep</div><div class="meta">3 of 10</div></div><button type="button" class="gh-iconbtn" aria-pressed="true" aria-label="Poems to keep"><svg class="gh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button></div><div class="gh-sheet__row"><div><div class="label" style="color:var(--ink-heading)">Rainy-day mysteries</div><div class="meta">10 of 10 · Full</div></div><button type="button" class="gh-iconbtn" aria-disabled="true" aria-label="Rainy-day mysteries"><svg class="gh-icon gh-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></div>
    <div class="gh-sheet__row"><div><div class="label" style="color:var(--ink-heading)">New bookshelf</div><div class="meta">3 of 3 bookshelves</div></div>
      <button type="button" class="gh-iconbtn" aria-disabled="true" aria-label="New bookshelf"><svg class="gh-icon gh-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></div>
    <p class="gh-metaline" style="margin-top:12px">Free members keep 3 bookshelves of 10 books.</p>
    <p class="gh-metaline">Everyone can see a bookshelf. Premium keeps it private.</p>
  </div>
</div>
</body>
</html>
