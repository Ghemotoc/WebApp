<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
</head>
<body>

<div class="gh-stage">
  <div class="gh-row">
    <button type="button" class="gh-btn gh-btn--main">Continue chapter 9</button>
    <button type="button" class="gh-btn gh-btn--quiet"><svg class="gh-icon gh-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>Add to a bookshelf</button>
    <button type="button" class="gh-btn gh-btn--text">Details</button>
  </div>
  <div class="gh-row">
    <span class="gh-caption" style="margin:0;width:64px">States</span>
    <button type="button" class="gh-btn gh-btn--main is-hover">Hover</button>
    <button type="button" class="gh-btn gh-btn--main is-focus">Keyboard focus</button>
    <button type="button" class="gh-btn gh-btn--quiet is-hover">Quiet on hover</button>
  </div>
  <div>
    <p class="gh-caption">Not ready yet: the button stays and says why</p>
    <div class="gh-btnwhy">
      <button type="button" class="gh-btn gh-btn--main" aria-describedby="why-publish">Publish</button>
      <span class="meta" id="why-publish">Add a chapter title to publish.</span>
    </div>
  </div>
</div>
</body>
</html>
