<!doctype html>
<!--
  The single HTML page the whole app runs in (story S1-E1-01).
  The browser loads it first; it loads src/main.tsx, which starts React.
  The title below is filled in from src/config/brand.ts at build time by vite.config.ts,
  so the product name is never typed here. lang="ro": the interface opens in Romanian.
-->
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%BRAND_PRODUCT_NAME%</title>
    <!-- The tab icon is the emblem, the sleeping cat (BRAND-1b; LOGO-2): a small PNG for browsers that can't draw SVG, then the
         Revolver emblem when the browser is light and the white one when it is dark (Robert, 11 Nov 2026). BrandTabIcon swaps in an approved upload. -->
    <link rel="icon" href="/brand/tab-icon-32.png" sizes="32x32" type="image/png" />
    <!-- The home-screen icon on iPhones and iPads: the Revolver cat on white, as Apple wants an opaque square (LOGO-2). -->
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" sizes="180x180" />
    <link
      rel="icon"
      href="/brand/emblem-light.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
      data-brand-icon="light"
    />
    <link
      rel="icon"
      href="/brand/emblem-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
      data-brand-icon="dark"
    />
    <!-- Picks light or night mode before anything draws, so night readers never see a white flash (S1-E1-03). -->
    <script src="/theme-init.js"></script>
    <!-- zod's settings, before any app code builds a schema: no eval under the security policy (QA-1c). -->
    <script src="/zod-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
