# Continuous integration: the checks every pull request must pass before it can merge (story S1-E1-01).
#
# Who starts it: GitHub, on every pull request and on every push to main.
# What it runs: lint, type check, unit tests, the i18n key check, the build and the bundle
# secret scan (job "checks");
# database tests with pgTAP and the generated-types check against a local Supabase (job "database");
# Playwright tests with axe accessibility checks against a local Supabase, so signed-in journeys
# run with the seed personas (job "e2e").
# Blocking the merge: a branch ruleset on main lists these three jobs as required status checks.
# What it never does: deploy or push migrations. Cloudflare Pages builds main and pull request
# previews through its own GitHub app (decided 17 Oct 2026, 12:57), and Supabase's GitHub
# integration applies supabase/migrations to staging when main changes (decided 17 Oct 2026).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: CI only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, i18n and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Node 24 from .nvmrc (decided 17 Oct 2026, 13:18).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:check
      # The same build Cloudflare Pages runs; it must write to dist/.
      - run: npm run build
      - name: Check the build wrote dist/index.html and dist/_redirects
        run: test -f dist/index.html && test -f dist/_redirects
      # No service role key or secret API key may reach the browser bundle (CLAUDE.md rule 2).
      - run: npm run scan:bundle

  database:
    name: Database tests and generated types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Start only the Postgres container, apply supabase/migrations and load supabase/seed.sql.
      - run: npx supabase db start
      # pgTAP tests in supabase/tests (CLAUDE.md rule 1).
      - run: npx supabase test db
      # Regenerate the database types and fail if they differ from the committed file (rule 14).
      - run: npm run types:check

  e2e:
    name: End-to-end and accessibility smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The local Supabase for signed-in tests (S1-E1-04): the database, Auth and the API only.
      # playwright.config.ts reads its address and public anon key from `supabase status`.
      # Mailpit stays on: sign-up and password-reset tests read their emails from it (S1-E2-01).
      - run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
      - run: npm run test:e2e
      # Keep the report for a week when something fails, so the failure can be looked at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
