# Continuous integration: the checks every pull request must pass before it can merge (story S1-E1-01).
#
# Who starts it: GitHub, when a pull request is opened, reopened, pushed to or marked ready for
# review, and on every push to main.
# What it runs: lint, type check, unit tests, the i18n key check, the migration version check,
# the build and the bundle secret scan (job "checks");
# database tests with pgTAP and the generated-types check against a local Supabase (job "database");
# Playwright tests with axe accessibility checks against a local Supabase, so signed-in journeys
# run with the seed personas (job "e2e").
# Every pull request runs the full suite (Robert, 8 Nov 2026: the repository is public, so
# GitHub-hosted runners cost no Actions minutes, and the full run belongs here rather than in a
# builder's session). This replaces the 1 Nov 2026 rule that ran "database" and "e2e" only after
# the merge to save minutes.
#   - On a pull request, drafts included, "checks", "database" and "e2e" all run, so a pull
#     request can only merge once the whole suite is green here.
#   - On a push to main the same three jobs run again, so main is checked after every merge too.
# Blocking the merge: a branch ruleset on main lists "checks", "database" and "e2e" as required
# status checks, so a failed "database" or "e2e" job blocks the merge. Never add workflow-level
# `paths`, `paths-ignore` or branch filters, and never use "[skip ci]": a workflow that doesn't run at all
# leaves its required checks "Pending" and the pull request can't merge (GitHub docs, "Skip
# workflow runs").
# What it never does: deploy or push migrations. Cloudflare Pages builds main and pull request
# previews through its own GitHub app (decided 17 Oct 2026, 12:57), and Supabase's GitHub
# integration applies supabase/migrations to staging when main changes (decided 17 Oct 2026).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: CI only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, i18n and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Node 24 from .nvmrc (decided 17 Oct 2026, 13:18).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A known high or critical hole in any package fails the build (architecture 1.9; QA-9, 8 Nov
      # 2026). Moderate ones are listed in the log and picked up by the weekly Dependabot pull request.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:check
      # No two migrations may share a version number: Supabase keys them by it (24 Oct 2026).
      # A new migration must also come after the newest one on main (QA-4), so main's file list
      # is fetched first (the checkout is shallow and has no origin/main of its own).
      - run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - run: npm run migrations:check
      # The same build Cloudflare Pages runs; it must write to dist/.
      - run: npm run build
      - name: Check the build wrote dist/index.html and dist/_redirects
        run: test -f dist/index.html && test -f dist/_redirects
      # No service role key or secret API key may reach the browser bundle (CLAUDE.md rule 2).
      - run: npm run scan:bundle
      # The first download every page needs, and the chapter reader's, stay within budget (QA-6).
      - run: npm run bundle:check
      # Nothing in the build may point at a site nobody reviewed (CLAUDE.md rule 7; S1-E14-03).
      - run: npm run third-party:check

  database:
    name: Database tests and generated types
    needs: [checks]
    # Runs on every pull request and every push to main, after "checks", even if "checks" failed,
    # so one run shows every failure at once (Robert, 8 Nov 2026: the full suite runs here).
    # `!cancelled()` replaces the default "every needed job succeeded", so a failed "checks"
    # doesn't skip it.
    if: '!cancelled()'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Start only the Postgres container, apply supabase/migrations and load supabase/seed.sql.
      # Up to three tries: the image registry sometimes refuses when every job pulls at once (QA-9).
      - run: scripts/ci/start-supabase.sh db start
      # pgTAP tests in supabase/tests (CLAUDE.md rule 1).
      - run: npx supabase test db
      # Regenerate the database types and fail if they differ from the committed file (rule 14).
      - run: npm run types:check
      # supabase/schema.sql must match what the migrations build (QA-4).
      - run: npm run schema:check

  e2e:
    name: End-to-end and accessibility smoke test
    needs: [checks]
    # Runs on every pull request and every push to main, after "checks", even if "checks" failed,
    # so one run shows every failure at once (Robert, 8 Nov 2026: the full suite runs here).
    # `!cancelled()` replaces the default "every needed job succeeded", so a failed "checks"
    # doesn't skip it.
    if: '!cancelled()'
    runs-on: ubuntu-latest
    # The suite runs on one worker (playwright.config.ts) and takes over 2 hours on one machine
    # (5 Nov 2026), so it is split into 4 shards, each on its own runner with its own local
    # Supabase: the shards share no database, so the tests' shared personas and flags can't clash
    # (QA-3, finding S5). Each shard is about 40 minutes; 60 leaves room.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 60
    steps:
      # The runner's disk filled up during a shard more than once (ENOSPC while Playwright wrote
      # a trace, 9 Nov 2026: G8e and NO-DOODLES), which failed tests that pass. The runner image
      # carries toolchains this job never uses (.NET, Android, Haskell, CodeQL), so they go first;
      # that frees well over 10 GB. Node comes from setup-node's own cache, which stays. Since
      # CI-2 (11 Nov 2026) Playwright also records a trace only on a retry (playwright.config.ts).
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium itself comes from Playwright's own download. Its system packages (mostly fonts)
      # come from Ubuntu's servers, which the runner sometimes can't reach (11 Nov 2026: every e2e
      # job died at this step for over an hour with "Temporary failure resolving
      # archive.ubuntu.com"). The runner image already has the libraries Chromium needs, so a failed
      # package install is reported as a warning and the tests still run (CI-3, Robert agreed).
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Install Chromium's system packages (a warning if Ubuntu's servers can't be reached)
        run: |
          if ! npx playwright install-deps chromium; then
            echo "::warning::Ubuntu's package servers could not be reached; Chromium runs with the packages already on the runner."
          fi
      # The local Supabase for signed-in tests (S1-E1-04): the database, Auth, the API and Storage.
      # playwright.config.ts reads its address and public anon key from `supabase status`.
      # Mailpit stays on: sign-up and password-reset tests read their emails from it (S1-E2-01).
      # Storage stays on: picture uploads, covers, banners, teacher proofs and the data and story
      # downloads all write to a bucket, and without it those tests fail with "name resolution
      # failed" (CI-1, 8 Nov 2026: they had been failing on main since Storage was left out).
      # Up to three tries: the image registry sometimes refuses when every job pulls at once (QA-9).
      - run: scripts/ci/start-supabase.sh start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      # When a shard fails, show where the runner's disk went, so an ENOSPC can be traced to the
      # folder that filled up instead of being rerun blind (CI-3, 11 Nov 2026: shard 3 ran out of
      # space twice in the search tests with over 100 GB free at the start).
      - name: Show disk use after a failure
        if: failure()
        run: |
          df -h
          sudo du -xsh /tmp /home/runner/.cache /home/runner/work /var/lib/docker /var/log 2>/dev/null || true
          sudo du -xh --max-depth=2 /tmp /home/runner/work 2>/dev/null | sort -rh | head -20 || true
          docker system df -v || true
      # Keep the report for a week when something fails, so the failure can be looked at.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
