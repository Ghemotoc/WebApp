# Continuous integration: the checks every pull request must pass before it can merge (story S1-E1-01).
#
# Who starts it: GitHub, when a pull request is opened, reopened, pushed to or marked ready for
# review, and on every push to main.
# What it runs: lint, type check, unit tests, the i18n key check, the migration version check,
# the build and the bundle secret scan (job "checks");
# database tests with pgTAP and the generated-types check against a local Supabase (job "database");
# Playwright tests with axe accessibility checks against a local Supabase, so signed-in journeys
# run with the seed personas (job "e2e").
# Saving Actions minutes (Robert, 1 Nov 2026: run the full tests only after the merge; before that
# the CTO's rule of 24 Oct 2026 ran them on the pull request and again on main):
#   - On a pull request only "checks" runs (about 3 minutes). "database" and "e2e" are skipped:
#     the builder runs the full suite locally before every merge and pastes the results into the
#     pull request ("Local check run"), so a second run here repeated the same work.
#   - On a push to main nothing skips: "database" and "e2e" run after every merge, so a failure
#     the local run missed shows on main within the hour and is fixed in the next pull request.
# Blocking the merge: a branch ruleset on main lists "checks", "database" and "e2e" as required
# status checks. A job skipped by its `if:` reports "Success" and still satisfies a required check
# (GitHub docs, "Control jobs with conditions"). Never add workflow-level `paths`,
# `paths-ignore` or branch filters, and never use "[skip ci]": a workflow that doesn't run at all
# leaves its required checks "Pending" and the pull request can't merge (GitHub docs, "Skip
# workflow runs").
# What it never does: deploy or push migrations. Cloudflare Pages builds main and pull request
# previews through its own GitHub app (decided 17 Oct 2026, 12:57), and Supabase's GitHub
# integration applies supabase/migrations to staging when main changes (decided 17 Oct 2026).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: CI only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, i18n and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Node 24 from .nvmrc (decided 17 Oct 2026, 13:18).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:check
      # No two migrations may share a version number: Supabase keys them by it (24 Oct 2026).
      # A new migration must also come after the newest one on main (QA-4), so main's file list
      # is fetched first (the checkout is shallow and has no origin/main of its own).
      - run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - run: npm run migrations:check
      # Lane B (23 Oct 2026): no doodle under design/assets may hold a raw hex colour; every colour
      # is a token with its light value as the fallback (scripts/doodle-tokens.ts).
      - run: npm run doodles:check
      # The same build Cloudflare Pages runs; it must write to dist/.
      - run: npm run build
      - name: Check the build wrote dist/index.html and dist/_redirects
        run: test -f dist/index.html && test -f dist/_redirects
      # No service role key or secret API key may reach the browser bundle (CLAUDE.md rule 2).
      - run: npm run scan:bundle
      # The first download every page needs, and the chapter reader's, stay within budget (QA-6).
      - run: npm run bundle:check
      # Nothing in the build may point at a site nobody reviewed (CLAUDE.md rule 7; S1-E14-03).
      - run: npm run third-party:check

  database:
    name: Database tests and generated types
    needs: [checks]
    # Runs only on a push to main, after "checks", even if "checks" failed there (main always gets
    # the full suite). On a pull request it is skipped, which counts as passed for the required
    # check (Robert, 1 Nov 2026: the full tests run locally before the merge and here after it).
    # `!cancelled()` replaces the default "every needed job succeeded", so a failed "checks" on
    # main doesn't skip it.
    if: "!cancelled() && github.event_name == 'push'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Start only the Postgres container, apply supabase/migrations and load supabase/seed.sql.
      - run: npx supabase db start
      # pgTAP tests in supabase/tests (CLAUDE.md rule 1).
      - run: npx supabase test db
      # Regenerate the database types and fail if they differ from the committed file (rule 14).
      - run: npm run types:check
      # supabase/schema.sql must match what the migrations build (QA-4).
      - run: npm run schema:check

  e2e:
    name: End-to-end and accessibility smoke test
    needs: [checks]
    # Runs only on a push to main, after "checks", even if "checks" failed there (main always gets
    # the full suite). On a pull request it is skipped, which counts as passed for the required
    # check (Robert, 1 Nov 2026: the full tests run locally before the merge and here after it).
    # `!cancelled()` replaces the default "every needed job succeeded", so a failed "checks" on
    # main doesn't skip it.
    if: "!cancelled() && github.event_name == 'push'"
    runs-on: ubuntu-latest
    # The suite runs on one worker (playwright.config.ts) and takes over 2 hours on one machine
    # (5 Nov 2026), so it is split into 4 shards, each on its own runner with its own local
    # Supabase: the shards share no database, so the tests' shared personas and flags can't clash
    # (QA-3, finding S5). Each shard is about 40 minutes; 60 leaves room.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The local Supabase for signed-in tests (S1-E1-04): the database, Auth and the API only.
      # playwright.config.ts reads its address and public anon key from `supabase status`.
      # Mailpit stays on: sign-up and password-reset tests read their emails from it (S1-E2-01).
      - run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      # Keep the report for a week when something fails, so the failure can be looked at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
