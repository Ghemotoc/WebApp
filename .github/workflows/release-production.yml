# Production deploy from a tagged release, after the founder approves it (story S1-E1-01).
#
# DISABLED until a production project exists: every job runs only when the repository variable
# PRODUCTION_ENABLED is "true" (Settings > Secrets and variables > Actions > Variables).
# See docs/runbooks/README.md ("Releasing to production") for the switch-on steps.
#
# Who starts it: pushing a tag such as v2027.03.01 that points at a commit on main.
# Rule (acceptance criterion): production never deploys from an untagged commit, and only after the
# founder approves it in GitHub. The approval is the "production" environment's required reviewer.
# Scope (Robert, 17 Oct 2026): the web app only. How migrations reach the production database is
# decided when the production Supabase project exists; this workflow never pushes migrations.
name: Release to production

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  deploy-web:
    name: Deploy the web app to production
    if: ${{ vars.PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The "production" environment holds the Cloudflare secrets and waits for a required reviewer.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Refuse a tag that points at a commit that never reached main (it skipped review and CI).
      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "This tag points at a commit that is not on main. Tag a commit on main instead." >&2
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production's own public values come from the "production" environment's variables.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Upload dist/ to the production Cloudflare Pages project (a Direct Upload project, separate
      # from the Git-connected staging project).
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PRODUCTION_PROJECT }} --branch=main
